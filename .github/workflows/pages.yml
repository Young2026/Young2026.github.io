name: Deploy Jeju site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          touch _site/.nojekyll
          base="https://jeju-field-notes.tristaforyoung.chatgpt.site"
          for asset in jeju-hero.webp jeju-view-1.webp jeju-view-2.webp jeju-view-3.webp jeju-view-4.webp seongsan-aerial.webp og.png; do
            curl --fail --location --retry 3 "$base/$asset" --output "_site/$asset"
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
